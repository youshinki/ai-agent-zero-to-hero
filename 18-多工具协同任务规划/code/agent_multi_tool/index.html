<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆版AI Agent | 长期连续对话助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f7fa; font-family: "Microsoft Yahei", sans-serif; }
        .container {
            max-width: 1000px; margin: 0 auto; height: 100vh;
            display: flex; flex-direction: column; padding: 20px;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: bold; color: #222; }
        .clear-btn {
            padding: 8px 16px; background: #f53f3f; color: #fff;
            border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
        }
        .chat-box {
            flex: 1; overflow-y: auto; background: #fff; border-radius: 12px;
            padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 12px #00000010;
        }
        .msg-item { margin-bottom: 16px; display: flex; }
        .user-msg { justify-content: flex-end; }
        .msg-content {
            max-width: 70%; padding: 12px 16px; border-radius: 10px;
            line-height: 1.6; white-space: pre-wrap; word-break: break-word;
        }
        .ai-msg .msg-content { background: #f0f4ff; color: #222; }
        .user-msg .msg-content { background: #367bfa; color: #fff; }
        .input-box { display: flex; gap: 10px; }
        #input-text {
            flex: 1; height: 48px; padding: 0 16px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 16px; outline: none;
        }
        #input-text:focus { border-color: #367bfa; }
        #send-btn {
            width: 90px; height: 48px; border: none; background: #367bfa;
            color: #fff; border-radius: 8px; font-size: 16px; cursor: pointer;
        }
        #send-btn:disabled { background: #94b8fa; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="title">记忆版AI Agent 连续对话助手</div>
            <button class="clear-btn" onclick="clearMemory()">清空记忆</button>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-box">
            <input type="text" id="input-text" placeholder="输入问题，拥有长期记忆..." autocomplete="off">
            <button id="send-btn">发送</button>
        </div>
    </div>
    <script>
        const API = "http://127.0.0.1:8000/api/agent";
        const chatBox = document.getElementById("chatBox");
        const inputText = document.getElementById("input-text");
        const sendBtn = document.getElementById("send-btn");
        let chatHistory = [];

        // 页面加载读取历史记忆
        async function loadHistory() {
            try {
                let res = await fetch(`${API}/history`);
                let json = await res.json();
                chatHistory = json.history || [];
                chatHistory.forEach(item => {
                    if (item.role === "user") addMsg(item.content, true);
                    else addMsg(item.content, false);
                });
            } catch (e) {
                console.warn("读取历史失败", e);
            }
        }

        function scrollBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 添加消息气泡（textContent 防XSS）
        function addMsg(text, isUser = false) {
            const div = document.createElement("div");
            div.className = `msg-item ${isUser ? "user-msg" : "ai-msg"}`;
            const content = document.createElement("div");
            content.className = "msg-content";
            content.textContent = text;
            div.appendChild(content);
            chatBox.appendChild(div);
            scrollBottom();
            return div;
        }

        // 发送消息
        async function sendMessage() {
            const text = inputText.value.trim();
            if (!text) return;

            addMsg(text, true);
            inputText.value = "";
            sendBtn.disabled = true;

            let aiDom = addMsg("");
            let contentDom = aiDom.querySelector(".msg-content");
            let fullText = "";

            try {
                const res = await fetch(`${API}/stream`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ task: text, history: chatHistory })
                });
                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n").filter(line => line);
                    for (let line of lines) {
                        try {
                            const data = JSON.parse(line);
                            fullText += data.char;
                            contentDom.textContent = fullText;
                            scrollBottom();
                        } catch (e) {}
                    }
                }
                // 更新本地对话记录（与服务端持久化一致）
                chatHistory.push({ role: "user", content: text });
                chatHistory.push({ role: "assistant", content: fullText });
            } catch (e) {
                contentDom.textContent = "服务请求失败，请检查后端服务是否启动！";
            }
            sendBtn.disabled = false;
        }

        // 清空记忆
        async function clearMemory() {
            try {
                await fetch(`${API}/clear`, { method: "POST" });
            } catch (e) {}
            chatHistory = [];
            chatBox.innerHTML = "";
        }

        sendBtn.addEventListener("click", sendMessage);
        inputText.addEventListener("keydown", e => {
            if (e.key === "Enter") sendMessage();
        });

        // 页面初始化加载记忆
        loadHistory();
    </script>
</body>
</html>
